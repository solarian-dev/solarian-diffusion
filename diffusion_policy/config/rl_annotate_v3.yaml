# Configuration v3: minimal-prompt annotation against a LOCAL Qwen2.5-VL.
#
# Same prompt-and-schema shape as v2 (terse system prompt, strict
# `{outcome, cell_number}` JSON schema, telemetry-block tie-breaker)
# but pointed at a self-hosted vLLM serving Qwen2.5-VL-7B-Instruct
# instead of Gemini Flash. Compared to v1 (the previous Qwen config)
# this drops the per-cell binary-tag scaffolding and relies on
# server-side constrained decoding to keep the output well-formed.
#
# Differences vs. v2 (Gemini):
#   * `vlm.base_url`     → local vLLM (http://10.0.0.159:8000/v1).
#   * `vlm.model`        → Qwen/Qwen2.5-VL-7B-Instruct.
#   * `vlm.api_key`      → "local" (vLLM ignores it but the SDK requires
#                          a non-empty value).
#   * `reasoning_effort` removed (Qwen2.5-VL has no thinking budget).
#   * `max_tokens` lowered (no thinking-token tax → ~64 tokens of JSON
#                            is plenty).
#   * Health check left ENABLED so a down server fails loudly instead
#     of silently flipping every chunk to UNCLEAR.
#
# Differences vs. v1 (Qwen, verbose prompt):
#   * No per-cell "before/after" tag procedure. The model only has to
#     answer the two-key schema; the JSON Schema constrained decoder
#     enforces the shape so we don't have to coach formatting.
#   * No reasoning field (the JSON schema forbids extra keys via
#     `additionalProperties: false`).
#
# IMPORTANT — vLLM image-cap caveat (same as v1):
#   vLLM defaults to `--limit-mm-per-prompt image=1` even for Qwen2.5-VL.
#   To keep `max_images_per_call: null` below (the recommended setting),
#   you MUST start vLLM with `--limit-mm-per-prompt image=N` where
#   N >= video.max_keyframes. If you see HTTP 400 "At most 1 image(s)
#   may be provided in one prompt", either fix the server flag or set
#   `vlm.max_images_per_call: 1` here.
#
# Usage:
#   # On the server side (example):
#   #   vllm serve Qwen/Qwen2.5-VL-7B-Instruct \
#   #       --port 8000 --limit-mm-per-prompt image=32
#   python scripts/annotate_rewards_vlm.py \
#       --in  data/datasets/...zarr.zip \
#       --config diffusion_policy/config/rl_annotate_v3.yaml \
#       --episodes 0 1 2 --visualize

vlm:
  base_url: http://10.0.0.159:8000/v1
  api_key: local
  # Qwen2.5-VL-7B-Instruct: solid multi-image understanding, follows
  # structured JSON output reliably under vLLM's guided-decoding
  # backend. Same model as v1; only the prompt scaffolding changes.
  # model: Qwen/Qwen2.5-VL-7B-Instruct
  model:  Qwen/Qwen3-VL-4B-Instruct
  temperature: 0.0
  timeout_s: 60.0
  # Two-key strict-schema reply (`{"outcome": "...", "cell_number": N}`)
  # is ~30-40 tokens. 256 leaves comfortable headroom for tokenizer
  # quirks without burning context on dead air.
  max_tokens: 256
  # No client-side grid composition; the server is expected to allow
  # multi-image prompts. See the vLLM caveat at the top of this file
  # if you hit a per-prompt image cap.
  max_images_per_call: null
  # Strict structured output via OpenAI's `json_schema` response_format.
  # vLLM 0.5+ wires this to its guided-decoding backend (xgrammar /
  # outlines), which uses a constrained-decoder to GUARANTEE the
  # reply matches the schema: no preamble, no markdown, no missing /
  # extra keys, no invalid enum values. The prompts below can stay
  # terse because the model is physically prevented from emitting
  # anything else.
  #
  # If your vLLM build is too old to support `response_format:
  # json_schema`, downgrade to `{"type": "json_object"}` and add a
  # one-line "respond with a JSON object" hint to the system prompt.
  response_format:
    type: json_schema
    json_schema:
      name: pick_outcome
      strict: true
      schema:
        type: object
        additionalProperties: false
        required: [outcome, cell_number]
        properties:
          outcome:
            type: string
            enum: [success_correct, wrong_object, miss_empty_grasp]
          cell_number:
            type: integer
  # Local server: keep the GET /v1/models pre-flight enabled so a
  # stopped / mis-loaded vLLM aborts the run immediately instead of
  # silently filling rl/ with UNCLEAR labels.
  skip_health_check: false

video:
  # Stride for sending frames to the VLM. A 200-frame episode at
  # stride 15 produces ~14 cells, well within Qwen2.5-VL-7B's
  # multi-image budget.
  frame_window_size: 15
  # Hard cap on frames per VLM call. Qwen2.5-VL-7B can handle 32+
  # images at 768px on a single A100/H100 if the vLLM server is
  # started with a matching `--limit-mm-per-prompt image=N`.
  max_keyframes: 32
  # Overlay the per-frame target bbox so the VLM can distinguish the
  # target block from other similar objects.
  bbox_overlay: "all"
  jpeg_quality: 90
  # Image resolution sent to the VLM. Higher = more vision tokens (and
  # more VRAM / slower decode) but better small-detail visibility
  # (gripper-block contact, lift height). 768 → ~1.4k tokens/image
  # for Qwen2.5-VL; 512 → ~600/image.
  resize_long_side: 768

prompts:
  # The schema does the heavy lifting; the prompt only states what the
  # task is. No JSON shape coaching, no formatting rules — vLLM's
  # constrained decoder enforces the response shape directly.
  target_description: "the LEGO block highlighted by the green bounding box"
  system: |
    You are a vision annotator for a robot grasping dataset. Each
    image you receive is one keyframe of a single task execution,
    stamped with a "cell K/N" badge in its top-right corner (K is
    the 0-based cell index, N the total cell count).
  user_template: |
    Identify the earliest cell where the target block (A green
    bounding box marks the target block) is grasped by the gripper and lifted off the surface,
    using the "cell K/N" badges to determine the cell index.
    Answer with key "cell_number" with the number of the cell selected.
    Answer with key "outcome" of the pick attempt: success_correct if the gripper grasped and lifted the bbox-highlighted target block; wrong_object if it grasped a DIFFERENT block; miss_empty_grasp if no block is grasped.
    If no block is grasped, answer cell_number with the value of the last cell.

    A "ROBOT TELEMETRY" block at the END of this message lists, one
    line per cell, the gripper position (mm relative to the first cell,
    +Z = up) and gripper width (mm) plus the action taken to the next
    cell (dpos, drot_deg, dgripper). A NEGATIVE dgripper paired with
    a POSITIVE dz at cell K is the canonical "closing on the block
    AND lifting" signature — use it as a tie-breaker when the visual
    is occluded.

reward_map:
  success_correct: 1.0
  wrong_object: -1.0
  miss_empty_grasp: -0.2
  pile_disturbance: -0.2
  timeout: 0.0
  unclear: 0.0

io:
  source_zarr: null
  output_zarr: null
  episode_subset: null
  resume: true
  rgb_key: camera0_rgb
  bbox_key: bbox
  # See rl_annotate.yaml for an explanation of the telemetry block.
  # The action delta is the cleanest signal for "did the gripper
  # close on the block and lift it" when the camera view is partial,
  # so we keep it on by default for the local Qwen config too.
  include_proprio_action: true
  eef_pos_key: robot0_eef_pos
  eef_rot_key: robot0_eef_rot_axis_angle
  gripper_key: robot0_gripper_width
  # Strict-by-default: any VLM call / parse failure aborts the run so
  # we don't silently fill rl/ with bogus labels when the server is
  # OOM / paused / mis-loaded.
  unclear_on_failure: false
