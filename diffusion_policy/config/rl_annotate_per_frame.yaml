# Configuration for per-frame VLM annotation of UMI grasping datasets.
#
# Strategy:
#   * For each chunk of N stride-sampled keyframes, ask the VLM ONE
#     boolean per cell per QUESTION listed in `prompts.questions`. The
#     response is a JSON object whose keys are the question names
#     (q1, q2, ...) and whose values are boolean arrays of length N.
#   * The script auto-generates the strict json_schema response_format
#     from the question list — no need to redeclare it here.
#   * The episode-level outcome (success / wrong-object / miss / ...)
#     is computed by `calculate_outcome(answers)` at the top of
#     `scripts/annotate_rewards_vlm_per_frame.py`, which takes the
#     concatenated-across-chunks per-cell booleans and returns
#     ``(outcome_name, terminal_cell_idx)``.
#
#   To add a new question, append an entry under `prompts.questions`
#   AND extend `calculate_outcome` to consume it. To remove a question,
#   delete the entry and the matching reads in `calculate_outcome`.
#
# Usage:
#   export GEMINI_API_KEY=...
#   python scripts/annotate_rewards_vlm_per_frame.py \
#       --in  data/datasets/...zarr.zip \
#       --config diffusion_policy/config/rl_annotate_per_frame.yaml \
#       --episodes 0 1 2 --visualize

vlm:
  base_url: https://generativelanguage.googleapis.com/v1beta/openai/
  api_key: ${oc.env:GEMINI_API_KEY,unset}
  model: gemini-3.5-flash
  temperature: 0.0
  timeout_s: 120.0
  # Schema emits one boolean array per question; budget grows with
  # N_questions * N_cells. 4096 is plenty for 3-5 questions and
  # 16-32 cells with `reasoning_effort: minimal` headroom.
  max_tokens: 4096
  reasoning_effort: minimal
  max_images_per_call: null
  # Auto-generated by the script from `prompts.questions` below. To
  # pin a custom schema, replace this null with a full
  # ``{type: json_schema, json_schema: {...}}`` dict.
  response_format: null
  skip_health_check: true
  # Generic repair: re-emit the same shape the auto-generated schema
  # demands. The script formats the question-name list into the
  # repair text at runtime.
  repair_user_text: |
    Your previous reply did not contain a parseable JSON object. Reply
    with a single JSON object (no markdown, no prose) whose keys are
    EXACTLY the question names listed in the user message and whose
    values are boolean arrays of length N (the number of cells shown).
    Original question follows:

video:
  frame_window_size: 15
  max_keyframes: 32
  bbox_overlay: "all"
  jpeg_quality: 90
  resize_long_side: 768

prompts:
  target_description: "the LEGO block highlighted by the green bounding box"
  system: |
    You are a vision annotator for a robot grasping dataset. Each
    image you receive is one keyframe of a single task execution,
    stamped with a "cell K/N" badge in its top-right corner (K is
    the 0-based cell index, N the total cell count).

  # The list of yes/no questions to ask, applied INDEPENDENTLY to
  # every cell. Each entry needs a `name` (used as the JSON key —
  # keep it short, e.g. q1/q2) and a `text` (the question itself).
  # The script auto-generates the response json_schema and the
  # per-cell prompt block from this list.
  #
  # To extend: append a new entry here, then update `calculate_outcome`
  # in `scripts/annotate_rewards_vlm_per_frame.py` to read it under
  # the same name.
  questions:
    - name: q1
      text: >-
        are the gripper fingers in FULL CONTACT with the target
        object (the block inside the green bbox)? "true" only if
        there is NO visible gap between either finger and the
        target. "false" if the fingers are still approaching, only
        partially touching, or closed on something other than the
        target (or closed on nothing).
    - name: q2
      text: >-
        is the target object visibly OFF the surface (lifted)?
        "true" only if there is a visible gap between the BOTTOM of
        the target block and the pile/table surface, OR the block
        is unambiguously higher than the rest of the pile or
        surface. "false" while the block is still resting on the
        surface, even if the gripper has already closed on it.
    - name: q3
      text: >-
        are the gripper fingers in FULL CONTACT with an object that
        is NOT the target object, either resting on the surface or
        already lifted off it? "true" only if there is no visible
        gap between either finger and a non-target object. "false"
        otherwise (including when the fingers are on the target,
        on nothing, or only partially touching a non-target).

  # The script formats this template with:
  #   target_description, chunk_header, n_questions, questions_block,
  #   question_names
  user_template: |
    Target: {target_description}. A green bounding box marks the
    target in every cell where the tracker has a lock (the box may
    freeze or disappear in late cells — that is normal and is NOT
    evidence of grasp failure; judge by the GRIPPER, not the bbox).

    {chunk_header}

    For EACH cell K in [0..N-1], answer the following {n_questions}
    INDEPENDENT yes/no questions:

    {questions_block}

    A "ROBOT TELEMETRY" block at the END of this message lists, one
    line per cell, the gripper position (mm relative to the first
    cell, +Z = up) and gripper width (mm) plus the action taken to
    the next cell (dpos, drot_deg, dgripper). A NEGATIVE dgripper
    means the gripper is closing; a POSITIVE dz means the gripper
    is moving up. Use these as tie-breakers when the visual is
    occluded.

    Reply with EXACTLY a JSON object whose keys are the question
    names ({question_names}) and whose values are boolean arrays of
    length N — one boolean per cell, in cell-index order. Each
    array MUST have exactly N entries (count the "cell K/N" badges
    before answering).

reward_map:
  success_correct: 1.0
  wrong_object: -1.0
  miss_empty_grasp: -1.0
  pile_disturbance: -0.2
  timeout: 0.0
  unclear: 0.0

io:
  source_zarr: null
  output_zarr: null
  episode_subset: null
  resume: true
  rgb_key: camera0_rgb
  bbox_key: bbox
  include_proprio_action: true
  eef_pos_key: robot0_eef_pos
  eef_rot_key: robot0_eef_rot_axis_angle
  gripper_key: robot0_gripper_width
  unclear_on_failure: false

# Per-frame-script-only knobs. Read by
# `scripts/annotate_rewards_vlm_per_frame.py`.
per_frame:
  # Outcome assigned when the VLM call fails for every chunk of an
  # episode (e.g. provider rate limit, malformed JSON after retry).
  # Used ONLY as a hard fallback — successful runs derive the
  # outcome from `calculate_outcome` in the script.
  default_outcome: miss_empty_grasp
